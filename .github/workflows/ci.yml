name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.24', '1.25' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted properly. Run 'make fmt'."
            gofmt -d .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0

      - name: Run Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Binary
        run: go build -v -o bin/mobius ./cmd/mobius

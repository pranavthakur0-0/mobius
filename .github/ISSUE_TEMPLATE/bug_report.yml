name: 🐛 Bug Report
description: File a bug report to help us improve Mobius
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Mobius!
  - type: input
    id: version
    attributes:
      label: Mobius Version / Commit
      description: What version or git commit hash are you using?
      placeholder: e.g. main branch (commit 20c2c27)
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: e.g. go version go1.24.0 linux/amd64
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Step by step instructions to reproduce the bug.
      placeholder: |
        1. Run './bin/mobius'
        2. Enter prompt '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Terminal logs, error traces, or EventStore logs.
      render: shell
